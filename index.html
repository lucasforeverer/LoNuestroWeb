<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dfc9;--paper:#f7f1e3;--ink:#231f1a;--mu:#6f6657;--ln:#cdbf9f;--ac:#bf3a22;--ok:#2d6a3e;--bad:#b3261e;--tx:var(--ink);--bd:var(--ln);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--paper:#25211c;--ink:#efe6d2;--mu:#a09580;--ln:#40382d;--ac:#ec6a4e;--ok:#79c28a;--bad:#f08a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg) radial-gradient(var(--ln) 1px,transparent 1px) 0 0/20px 20px;color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;max-width:1000px;padding:0 14px 90px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:3px double var(--ink);padding:18px 0 8px}
h1{font:800 30px/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.5px}
#sy{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--mu);white-space:nowrap}
h2{font:700 18px Fraunces,Georgia,serif;margin:0 0 12px}
nav{display:flex;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--ln);margin-bottom:18px}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:13px 14px 9px;font:500 12px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--ac)}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1.5px solid var(--ink);border-radius:2px;background:var(--paper);margin-bottom:16px}
.kpi{padding:12px 14px;border-right:1px dashed var(--ln);border-bottom:1px dashed var(--ln)}
.kpi span,label{display:block;font:500 11px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
label{margin-bottom:4px}
.kpi b{display:block;margin-top:4px;font:500 21px "IBM Plex Mono",ui-monospace,monospace}
.ck{display:flex;align-items:center;font:500 14px "IBM Plex Sans",system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink)}
input,select{width:100%;padding:10px;border:1.5px solid var(--ink);border-radius:2px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--ac)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.btn{background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);padding:10px 18px;border-radius:2px;font:600 14px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--ac);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.g{background:var(--ok);border-color:var(--ok);color:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.btn.s{background:transparent;color:var(--ink);border:1px solid var(--mu);box-shadow:none;padding:4px 9px;font:500 12px "IBM Plex Mono",ui-monospace,monospace}
.btn.s.okb{border-color:var(--ok);color:var(--ok)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:460px}
th{font:500 11px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--ink)}
td{padding:9px 6px;border-bottom:1px dashed var(--ln);white-space:nowrap}
td.r,th.r{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{font:500 10px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--mu);color:var(--mu);padding:1px 5px;margin-left:6px;border-radius:2px;vertical-align:middle}
.low{color:var(--bad);font-weight:700}.ok{color:var(--ok)}.mu{color:var(--mu)}.r{text-align:right}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:8px;font:12px "IBM Plex Mono",ui-monospace,monospace}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:12px}
.pb{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:2px;padding:12px 10px;text-align:left;font:600 15px/1.2 Fraunces,Georgia,serif;box-shadow:3px 3px 0 var(--ln);cursor:pointer}
.pb:active{transform:translate(3px,3px);box-shadow:none}
.pb b{display:block;margin-top:8px;color:var(--ac);font:500 16px "IBM Plex Mono",ui-monospace,monospace}
.pb small{font:11px "IBM Plex Mono",ui-monospace,monospace;color:var(--mu)}
.ln{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ln)}.ln span{flex:1}
.tot{margin:12px 0;padding-top:8px;border-top:2px solid var(--ink);font:500 26px "IBM Plex Mono",ui-monospace,monospace}
.ch{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1.5px solid var(--ink)}
.ch i{flex:1;background:var(--ink);opacity:.8;min-height:2px}.ch i.pk{background:var(--ac);opacity:1}
.ov{position:fixed;inset:0;background:rgba(35,31,26,.65);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
#login .ov{background:var(--bg)}
.md{width:100%;max-width:560px;margin:0;box-shadow:6px 6px 0 var(--ink)}.rw{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:2px;font:500 13px "IBM Plex Mono",ui-monospace,monospace;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw}#toast.show{opacity:1}
</style>
</head>
<body>
<header><h1 id="hd"></h1><div id="sy"></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal"></div>
<div id="login"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL=GASTRO.url,SB_KEY=GASTRO.key; /* se leen de config.js */
const sb=supabase.createClient(SB_URL,SB_KEY);
const EMPTY=()=>({productos:[],insumos:[],compras:[],ventas:[],abonos:[],pagos:{},cfg:{local:'Gastro'}});
let db=EMPTY(),uidU=null,userLabel='',synced={},tmr=null,pend=false,lastTs=0;
const setSync=m=>{const e=document.getElementById('sy');if(e)e.textContent=m};
/* Los datos se guardan en la nube divididos: base + ventas y compras por mes */
const mk=x=>(x.fecha||'0000-00').slice(0,7);
const split=d=>{const o={base:{productos:d.productos,insumos:d.insumos,abonos:d.abonos,pagos:d.pagos,cfg:d.cfg}};
  d.ventas.forEach(x=>{(o['v:'+mk(x)]=o['v:'+mk(x)]||[]).push(x)});
  d.compras.forEach(x=>{(o['c:'+mk(x)]=o['c:'+mk(x)]||[]).push(x)});return o};
const join=rows=>{const d=EMPTY();rows.sort((a,b)=>a.k<b.k?-1:1).forEach(r=>{
  if(r.k==='base')Object.assign(d,r.v);else if(r.k[0]==='v')d.ventas.push(...r.v);else d.compras.push(...r.v)});
  d.cfg=d.cfg||{local:'Gastro'};return d};
const push=async()=>{if(!uidU)return;const o=split(db),up=[];
  Object.keys(o).forEach(k=>{const t=JSON.stringify(o[k]);if(t!==synced[k])up.push({k,t,v:o[k]})});
  Object.keys(synced).forEach(k=>{if(!(k in o)&&synced[k]!=='[]')up.push({k,t:'[]',v:[]})});
  if(!up.length){pend=false;setSync('● Guardado');return}
  const ts=new Date();const {error}=await sb.from('datos').upsert(up.map(r=>({user_id:uidU,k:r.k,v:r.v,updated_at:ts.toISOString()})));
  if(error){setSync('! Sin conexión, reintentando…');tmr=setTimeout(push,8000);return}
  up.forEach(r=>synced[r.k]=r.t);lastTs=ts.getTime();pend=false;setSync('● Guardado')};
const save=()=>{recalc();try{localStorage.setItem('gastro_c_'+uidU,JSON.stringify(db))}catch(e){}
  pend=true;clearTimeout(tmr);setSync('○ Guardando…');tmr=setTimeout(push,700)};
const showLogin=msg=>{document.getElementById('login').innerHTML=`<div class="ov"><div class="card md"><h2>Gastro</h2><p class="mu" style="margin-top:-6px">Gestión de viandas · ingresá con tu usuario</p><div class="f" style="grid-template-columns:1fr"><div><label>Usuario</label><input id="lu" autocapitalize="none" autocomplete="username"></div><div><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn" id="lb">Entrar</button></div><p class="low">${msg||''}</p></div></div>`;
  const lb=document.getElementById('lb');
  lb.onclick=async()=>{let u=document.getElementById('lu').value.trim().toLowerCase();if(!u.includes('@'))u+='@gastro.app';
    const {error}=await sb.auth.signInWithPassword({email:u,password:document.getElementById('lp').value});
    if(error){const m=error.message||'';showLogin(m.includes('Invalid login')?'Usuario o contraseña incorrectos':m.includes('not confirmed')?'El usuario no está confirmado en Supabase (marcá Auto Confirm al crearlo)':'Error de conexión: '+m+' → revisá config.js')}else start()};
  document.getElementById('lp').onkeydown=e=>{if(e.key==='Enter')lb.click()}};
const start=async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}
  uidU=session.user.id;userLabel=(session.user.email||'').replace('@gastro.app','');
  document.getElementById('login').innerHTML='';setSync('Cargando…');
  const {data,error}=await sb.from('datos').select('k,v,updated_at');
  if(error){try{db=Object.assign(EMPTY(),JSON.parse(localStorage.getItem('gastro_c_'+uidU)))}catch(e){}setSync('! Sin conexión (datos locales)');render();return}
  lastTs=Math.max(0,...data.map(r=>+new Date(r.updated_at)));db=data.length?join(data):EMPTY();
  const o=split(db);synced={};Object.keys(o).forEach(k=>synced[k]=JSON.stringify(o[k]));
  if(migrar())save();setSync('● Sincronizado');render()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const M=n=>'$'+(+n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
const rd=n=>Math.round(n*1000)/1000;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const v=id=>document.getElementById(id).value;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prod=id=>db.productos.find(p=>p.id===id);
const ins=id=>db.insumos.find(p=>p.id===id);
const ing=id=>ins(id)||prod(id);
const recalc=()=>db.productos.forEach(p=>{if(isPl(p))p.costo=rd(cst(p))});
const porc=p=>Math.floor(Math.min(...p.receta.map(r=>{const i=ing(r.id);return i&&r.cant>0?i.stock/r.cant:Infinity})));
/* Migración: los productos que ya eran ingredientes de una receta pasan a Insumos */
const migrar=()=>{db.insumos=db.insumos||[];const us=new Set();db.productos.forEach(p=>isPl(p)&&p.receta.forEach(r=>us.add(r.id)));
  const mv=db.productos.filter(p=>!isPl(p)&&us.has(p.id));if(!mv.length)return false;
  mv.forEach(p=>db.insumos.push({id:p.id,nombre:p.nombre,unidad:p.unidad,costo:p.costo,stock:p.stock,minimo:p.minimo}));
  db.productos=db.productos.filter(p=>!mv.includes(p));return true};
const isPl=p=>Array.isArray(p.receta);
const cst=p=>isPl(p)?p.receta.reduce((a,r)=>{const i=ing(r.id);return a+(i?i.costo*r.cant:0)},0):p.costo;
const toast=m=>{const t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)};
let tab='inicio',mes=today().slice(0,7),cart={},q='',mp='Efectivo',tmp=null,editId=null;
const TABS=[['inicio','Inicio'],['vender','Vender'],['stock','Stock'],['compras','Compras'],['abonos','Abonos'],['insumos','Insumos'],['ajustes','Ajustes']];
const opts=(f)=>db.productos.filter(f||(()=>1)).map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
const norm=s=>String(s).toLowerCase();
const filt=()=>db.productos.filter(p=>norm(p.nombre+' '+(p.cat||'')).includes(norm(q)));

function render(){
  $('hd').textContent=db.cfg.local;
  $('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
  $('app').innerHTML=V[tab]();
}
const grid=()=>filt().map(p=>`<button class="pb" data-act="add" data-id="${p.id}">${esc(p.nombre)}<b>${M(p.precio)}</b><small class="${!isPl(p)&&p.stock<=p.minimo?'low':''}">${isPl(p)?(isFinite(porc(p))?'alcanza p/ '+porc(p):'vianda'):p.stock+' '+p.unidad}</small></button>`).join('')||'<span class="mu">Sin productos. Cargalos en Stock.</span>';
const cartTot=()=>Object.keys(cart).reduce((a,id)=>{const p=prod(id);return a+(p?p.precio*cart[id]:0)},0);
const cartHtml=()=>{const ids=Object.keys(cart);if(!ids.length)return '<span class="mu">Tocá un producto para agregarlo.</span>';
  return ids.map(id=>{const p=prod(id);return `<div class="ln"><span>${esc(p.nombre)}</span><button class="btn s" data-act="dec" data-id="${id}">−</button><b>${cart[id]}</b><button class="btn s" data-act="add" data-id="${id}">+</button><b style="min-width:70px;text-align:right">${M(p.precio*cart[id])}</b></div>`}).join('')+
  `<div class="tot">Total ${M(cartTot())}</div><div class="f"><div><label>Medio de pago</label><select data-mp>${['Efectivo','Transferencia','Tarjeta','QR'].map(m=>`<option ${m===mp?'selected':''}>${m}</option>`).join('')}</select></div><button class="btn g" data-act="cobrar">Cobrar</button><button class="btn s" data-act="vaciar">Vaciar</button></div>`};
const stockTbl=()=>`<table><tr><th>Producto</th><th>Cat.</th><th class="r">Costo</th><th class="r">Precio</th><th class="r">Stock</th><th></th></tr>`+
  (filt().map(p=>`<tr><td>${esc(p.nombre)}${isPl(p)?'<span class="tag">receta</span>':''}</td><td class="mu">${esc(p.cat)}</td><td class="r">${M(cst(p))}</td><td class="r">${M(p.precio)}</td><td class="r ${!isPl(p)&&p.stock<=p.minimo?'low':''}">${isPl(p)?'—':p.stock+' '+p.unidad}</td><td><button class="btn s" data-act="editProd" data-id="${p.id}">Editar</button> <button class="btn s" data-act="delProd" data-id="${p.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin resultados.</td></tr>')+'</table>';

const insTbl=()=>`<table><tr><th>Insumo</th><th class="r">Costo</th><th class="r">Stock</th><th class="r">Mín.</th><th>Usado en</th><th></th></tr>`+(db.insumos.filter(i=>norm(i.nombre).includes(norm(q))).map(i=>`<tr><td>${esc(i.nombre)}</td><td class="r">${M(i.costo)} / ${i.unidad}</td><td class="r ${i.stock<=i.minimo?'low':''}">${i.stock} ${i.unidad}</td><td class="r mu">${i.minimo}</td><td class="mu">${db.productos.filter(p=>isPl(p)&&p.receta.some(r=>r.id===i.id)).length} viandas</td><td><button class="btn s" data-act="editIns" data-id="${i.id}">Editar</button> <button class="btn s" data-act="delIns" data-id="${i.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin insumos todavía.</td></tr>')+'</table>';

const V={
insumos(){
  return `<div class="card"><div class="f"><input placeholder="Buscar…" value="${esc(q)}" data-q><button class="btn" data-act="newIns">+ Nuevo insumo</button></div>
  <p class="mu" style="font-size:12px;margin:8px 0 0">Acá van carne, huevo, pan rallado, papas, bandejas… Se usan en las recetas de las viandas (pestaña Stock) y se reponen desde Compras.</p></div>
  <div class="card tw" id="lst">${insTbl()}</div>`;
},
inicio(){
  const inM=x=>x.fecha.slice(0,7)===mes;
  const vs=db.ventas.filter(inM),ven=vs.reduce((a,x)=>a+x.cant*x.precio,0),cmv=vs.reduce((a,x)=>a+x.cant*(x.costo||0),0);
  const cmp=db.compras.filter(inM).reduce((a,x)=>a+x.cant*x.costo,0);
  let ci=0,pg=0;db.abonos.forEach(a=>{if(db.pagos[a.id+'|'+mes]){a.tipo==='cobro'?ci+=a.monto:pg+=a.monto}});
  const res=ven+ci-cmp-pg,tk=new Set(vs.map(x=>x.t||x.id)).size;
  const days=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate(),dv=Array(days).fill(0);
  vs.forEach(x=>dv[+x.fecha.slice(8,10)-1]+=x.cant*x.precio);const mx=Math.max(...dv,1);
  const top={};vs.forEach(x=>top[x.nombre]=(top[x.nombre]||0)+x.cant*x.precio);
  const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bajo=[...db.productos.filter(p=>!isPl(p)&&p.stock<=p.minimo),...db.insumos.filter(p=>p.stock<=p.minimo)];
  const pend=db.abonos.filter(a=>!db.pagos[a.id+'|'+mes]);
  const val=db.productos.reduce((a,p)=>a+(isPl(p)?0:p.stock*p.costo),0)+db.insumos.reduce((a,i)=>a+i.stock*i.costo,0);
  return `<div class="card"><label>Mes</label><input type="month" value="${mes}" data-mes style="max-width:190px"></div>
  <div class="grid"><div class="kpi"><span>Ventas</span><b>${M(ven)}</b></div><div class="kpi"><span>Tickets · promedio</span><b>${tk} · ${M(tk?ven/tk:0)}</b></div>
  <div class="kpi"><span>Compras</span><b>${M(cmp)}</b></div><div class="kpi"><span>Ganancia bruta</span><b>${M(ven-cmv)}</b></div>
  <div class="kpi"><span>Abonos cobrados</span><b>${M(ci)}</b></div><div class="kpi"><span>Gastos fijos pagados</span><b>${M(pg)}</b></div>
  <div class="kpi"><span>Resultado de caja</span><b class="${res>=0?'ok':'low'}">${M(res)}</b></div><div class="kpi"><span>Valor del stock</span><b>${M(val)}</b></div></div>
  <div class="card"><h2>Ventas por día</h2><div class="ch">${dv.map((x,i)=>`<i ${x===mx&&x>0?'class="pk"':''} title="Día ${i+1}: ${M(x)}" style="height:${x/mx*100}%"></i>`).join('')}</div><div class="mu" style="font-size:12px;display:flex;justify-content:space-between"><span>1</span><span>${days}</span></div></div>
  <div class="card"><h2>Más vendidos</h2>${tp.map((t,i)=>`<div class="ln"><span>${i+1}. ${esc(t[0])}</span><b>${M(t[1])}</b></div>`).join('')||'<span class="mu">Sin ventas este mes.</span>'}</div>
  <div class="card"><h2>Stock bajo</h2>${bajo.map(p=>`<div>${esc(p.nombre)}: <span class="low">${p.stock} ${p.unidad}</span> <span class="mu">(mín. ${p.minimo})</span></div>`).join('')||'<span class="mu">Todo en orden.</span>'}</div>
  <div class="card"><h2>Abonos pendientes del mes</h2>${pend.map(a=>`<div class="ln"><span>${esc(a.nombre)} <small class="mu">${a.tipo==='cobro'?'a cobrar':'a pagar'} · día ${a.dia}</small></span><b>${M(a.monto)}</b></div>`).join('')||'<span class="mu">Nada pendiente.</span>'}</div>`;
},
vender(){
  return `<div class="card"><input placeholder="Buscar producto…" value="${esc(q)}" data-q><div class="pg" id="grid">${grid()}</div></div>
  <div class="card" id="cart">${cartHtml()}</div>
  <div class="card tw"><h2>Últimas ventas</h2><table><tr><th>Fecha</th><th>Producto</th><th class="r">Cant.</th><th class="r">Total</th><th>Pago</th><th></th></tr>
  ${[...db.ventas].reverse().slice(0,40).map(c=>`<tr><td>${c.fecha}</td><td>${esc(c.nombre)}</td><td class="r">${c.cant}</td><td class="r">${M(c.cant*c.precio)}</td><td class="mu">${c.mp}</td><td><button class="btn s" data-act="delVenta" data-id="${c.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin ventas.</td></tr>'}</table></div>`;
},
stock(){
  return `<div class="card"><div class="f"><input placeholder="Buscar…" value="${esc(q)}" data-q><button class="btn" data-act="newProd">+ Nuevo producto o plato</button></div>
  <p class="mu" style="font-size:12px;margin:8px 0 0">Acá van las viandas que vendés. Sus ingredientes se cargan en la pestaña Insumos y se descuentan solos al vender.</p></div>
  <div class="card tw" id="lst">${stockTbl()}</div>`;
},
compras(){
  return `<div class="card"><h2>Registrar compra de insumos (suma al stock de Insumos)</h2><div class="f">
  <div><label>Fecha</label><input id="d" type="date" value="${today()}"></div><div><label>Proveedor</label><input id="pv"></div>
  <div><label>Insumo</label><select id="p">${db.insumos.map(i=>`<option value="${i.id}">${esc(i.nombre)} (${i.unidad})</option>`).join('')}</select></div><div><label>Cantidad</label><input id="q" type="number" step="any" inputmode="decimal"></div>
  <div><label>Costo unitario</label><input id="co" type="number" step="any" inputmode="decimal"></div><button class="btn" data-act="addCompra">Registrar</button></div></div>
  <div class="card tw"><table><tr><th>Fecha</th><th>Proveedor</th><th>Insumo</th><th class="r">Cant.</th><th class="r">Total</th><th></th></tr>
  ${[...db.compras].reverse().slice(0,60).map(c=>`<tr><td>${c.fecha}</td><td>${esc(c.prov)}</td><td>${esc(c.nombre)}</td><td class="r">${c.cant}</td><td class="r">${M(c.cant*c.costo)}</td><td><button class="btn s" data-act="delCompra" data-id="${c.id}">✕</button></td></tr>`).join('')||'<tr><td class="mu">Sin compras.</td></tr>'}</table></div>`;
},
abonos(){
  const hoy=today(),vence=a=>mes<hoy.slice(0,7)||(mes===hoy.slice(0,7)&&a.dia<+hoy.slice(8));
  return `<div class="card"><h2>Nuevo abono mensual</h2><div class="f">
  <div><label>Concepto / cliente</label><input id="n" placeholder="Alquiler, Luz, Cliente X…"></div>
  <div><label>Tipo</label><select id="t"><option value="gasto">Gasto fijo (pago)</option><option value="cobro">Abono de cliente (cobro)</option></select></div>
  <div><label>Monto mensual</label><input id="m" type="number" step="any" inputmode="decimal"></div><div><label>Día de vencimiento</label><input id="di" type="number" min="1" max="31" value="10"></div>
  <button class="btn" data-act="addAbono">Guardar</button></div></div>
  <div class="card tw"><div style="margin-bottom:8px"><label>Mes</label><input type="month" value="${mes}" data-mes style="max-width:190px"></div>
  <table><tr><th>Concepto</th><th>Tipo</th><th class="r">Monto</th><th>Vence</th><th>Estado</th><th></th></tr>
  ${db.abonos.map(a=>{const ok=db.pagos[a.id+'|'+mes];return `<tr><td>${esc(a.nombre)}</td><td class="mu">${a.tipo==='cobro'?'Cobro':'Pago'}</td><td class="r">${M(a.monto)}</td><td class="${!ok&&vence(a)?'low':''}">día ${a.dia}</td><td><button class="btn s ${ok?'okb':''}" data-act="togPago" data-id="${a.id}">${ok?(a.tipo==='cobro'?'Cobrado':'Pagado'):'Pendiente'}</button></td><td><button class="btn s" data-act="delAbono" data-id="${a.id}">✕</button></td></tr>`}).join('')||'<tr><td class="mu">Sin abonos.</td></tr>'}</table></div>`;
},
ajustes(){
  return `<div class="card"><h2>Cuenta</h2><p class="mu">Sesión: ${esc(userLabel)}</p><button class="btn s" data-act="logout">Cerrar sesión</button></div>
  <div class="card"><h2>Nombre del local</h2><div class="f"><input id="loc" value="${esc(db.cfg.local)}"><button class="btn" data-act="setLocal">Guardar</button></div></div>
  <div class="card"><h2>Respaldo</h2><p class="mu">Los datos viven en este dispositivo. Copiá este texto y guardalo (mail, notas) para pasarlo a otro equipo o por si desinstalás la app.</p>
  <textarea id="exp" readonly>${esc(JSON.stringify(db))}</textarea><p><button class="btn" data-act="copy">Copiar respaldo</button></p></div>
  <div class="card"><h2>Restaurar</h2><textarea id="imp" placeholder="Pegá acá un respaldo…"></textarea>
  <p><button class="btn" data-act="import">Restaurar (reemplaza todo)</button> <button class="btn s" data-act="reset">Borrar todo</button></p></div>`;
}};

/* Modal de producto / plato */
const readM=()=>{if(!$('mn'))return;tmp.nombre=v('mn');tmp.cat=v('mc');tmp.unidad=v('mu');tmp.precio=+v('mpr')||0;
  if(tmp.plato){tmp.receta=tmp.receta.map((r,i)=>({id:v('ri'+i),cant:+v('rc'+i)||0}))}else{tmp.costo=+v('mco')||0;tmp.stock=+v('mst')||0;tmp.minimo=+v('mmi')||0}};
const modal=()=>{const lista=db.insumos;
  $('modal').innerHTML=`<div class="ov"><div class="card md"><h2>${editId?'Editar':'Nuevo'} producto</h2><div class="f">
  <div><label>Nombre</label><input id="mn" value="${esc(tmp.nombre)}"></div><div><label>Categoría</label><input id="mc" list="cats" value="${esc(tmp.cat)}"><datalist id="cats">${[...new Set(db.productos.map(p=>p.cat).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
  <div><label>Unidad</label><select id="mu">${['un','kg','lt','porción'].map(u=>`<option ${u===tmp.unidad?'selected':''}>${u}</option>`).join('')}</select></div>
  <div><label>Precio de venta</label><input id="mpr" type="number" step="any" inputmode="decimal" value="${tmp.precio||''}"></div></div>
  <p><label class="ck"><input type="checkbox" data-pl ${tmp.plato?'checked':''}>Vianda con receta (usa insumos y descuenta al vender)</label></p>
  ${tmp.plato?`<label>Receta</label>${tmp.receta.map((r,i)=>`<div class="rw"><select id="ri${i}">${lista.map(p=>`<option value="${p.id}" ${p.id===r.id?'selected':''}>${esc(p.nombre)} (${p.unidad})</option>`).join('')}</select><input id="rc${i}" type="number" step="any" inputmode="decimal" placeholder="Cant." value="${r.cant||''}"><button class="btn s" data-act="delIng" data-id="${i}">✕</button></div>`).join('')}
  <button class="btn s" data-act="addIng">+ Ingrediente</button><p class="mu">${db.insumos.length?'':'Primero cargá insumos en la pestaña Insumos. '}Costo calculado: <b>${M(cst({receta:tmp.receta}))}</b>${tmp.precio>0?' · Margen '+Math.round((tmp.precio-cst({receta:tmp.receta}))/tmp.precio*100)+'%':''}</p>`:
  `<div class="f"><div><label>Costo unitario</label><input id="mco" type="number" step="any" inputmode="decimal" value="${tmp.costo||''}"></div><div><label>Stock actual</label><input id="mst" type="number" step="any" inputmode="decimal" value="${tmp.stock}"></div><div><label>Stock mínimo</label><input id="mmi" type="number" step="any" inputmode="decimal" value="${tmp.minimo}"></div></div>`}
  <p style="display:flex;gap:8px;margin-bottom:0"><button class="btn" data-act="saveProd">Guardar</button><button class="btn s" data-act="closeM">Cancelar</button></p></div></div>`};

const modalI=()=>{$('modal').innerHTML=`<div class="ov"><div class="card md"><h2>${editId?'Editar':'Nuevo'} insumo</h2><div class="f">
  <div><label>Nombre</label><input id="in" value="${esc(tmp.nombre)}" placeholder="Carne, Huevo, Bandeja…"></div>
  <div><label>Unidad</label><select id="iu">${['un','kg','g','lt','ml'].map(u=>`<option ${u===tmp.unidad?'selected':''}>${u}</option>`).join('')}</select></div>
  <div><label>Costo por unidad</label><input id="ic" type="number" step="any" inputmode="decimal" value="${tmp.costo||''}"></div>
  <div><label>Stock actual</label><input id="is" type="number" step="any" inputmode="decimal" value="${tmp.stock}"></div>
  <div><label>Stock mínimo</label><input id="im" type="number" step="any" inputmode="decimal" value="${tmp.minimo}"></div></div>
  <p class="mu" style="font-size:12px">Costo por unidad = lo que pagás por 1 kg, 1 huevo, 1 bandeja… En las recetas usás esa misma unidad.</p>
  <p style="display:flex;gap:8px;margin-bottom:0"><button class="btn" data-act="saveIns">Guardar</button><button class="btn s" data-act="closeM">Cancelar</button></p></div></div>`};

const A={
add(id){cart[id]=(cart[id]||0)+1;$('cart').innerHTML=cartHtml();return 1},
dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];$('cart').innerHTML=cartHtml();return 1},
vaciar(){cart={};$('cart').innerHTML=cartHtml();return 1},
cobrar(){const ids=Object.keys(cart);if(!ids.length)return 1;const t=uid(),f=today();
  ids.forEach(id=>{const p=prod(id),n=cart[id];if(!p)return;let cons=[],costo;
    if(isPl(p)){costo=cst(p);p.receta.forEach(r=>{const i=ing(r.id);if(i){i.stock=rd(i.stock-r.cant*n);cons.push({id:i.id,q:r.cant*n})}})}
    else{costo=p.costo;p.stock=rd(p.stock-n);cons=[{id:p.id,q:n}]}
    db.ventas.push({id:uid(),t,fecha:f,pid:p.id,nombre:p.nombre,cant:n,precio:p.precio,costo,mp,cons})});
  const neg=db.insumos.filter(i=>i.stock<0).map(i=>i.nombre);cart={};toast(neg.length?'Vendido. Falta stock de: '+neg.join(', '):'Venta registrada')},
delVenta(id){const c=db.ventas.find(x=>x.id===id);if(!confirm('¿Anular esta venta y devolver el stock?'))return 1;
  (c.cons||[{id:c.pid,q:c.cant}]).forEach(k=>{const p=ing(k.id);if(p)p.stock=rd(p.stock+k.q)});db.ventas=db.ventas.filter(x=>x.id!==id)},
newProd(){editId=null;tmp={nombre:'',cat:'',unidad:'un',precio:0,costo:0,stock:0,minimo:0,plato:false,receta:[]};modal();return 1},
editProd(id){const p=prod(id);editId=id;tmp={nombre:p.nombre,cat:p.cat||'',unidad:p.unidad,precio:p.precio,costo:p.costo,stock:p.stock,minimo:p.minimo,plato:isPl(p),receta:isPl(p)?p.receta.map(r=>({...r})):[]};modal();return 1},
addIng(){readM();const f=db.insumos[0];if(!f){toast('Primero cargá insumos');return 1}tmp.receta.push({id:f.id,cant:0});modal();return 1},
delIng(i){readM();tmp.receta.splice(+i,1);modal();return 1},
closeM(){$('modal').innerHTML='';return 1},
saveProd(){readM();const n=tmp.nombre.trim();if(!n){toast('Falta el nombre');return 1}
  const d={nombre:n,cat:tmp.cat.trim(),unidad:tmp.unidad,precio:tmp.precio};
  if(tmp.plato){d.receta=tmp.receta.filter(r=>r.id&&r.cant>0);d.costo=rd(cst(d));d.stock=0;d.minimo=0}else{d.costo=tmp.costo;d.stock=tmp.stock;d.minimo=tmp.minimo}
  if(editId){const p=prod(editId);if(!tmp.plato)delete p.receta;Object.assign(p,d)}else db.productos.push({id:uid(),...d});
  $('modal').innerHTML='';toast('Guardado')},
delProd(id){if(confirm('¿Borrar producto?'))db.productos=db.productos.filter(p=>p.id!==id);else return 1},
newIns(){editId=null;tmp={nombre:'',unidad:'un',costo:0,stock:0,minimo:0};modalI();return 1},
editIns(id){const p=ins(id);editId=id;tmp={nombre:p.nombre,unidad:p.unidad,costo:p.costo,stock:p.stock,minimo:p.minimo};modalI();return 1},
saveIns(){const n=v('in').trim();if(!n){toast('Falta el nombre');return 1}
  const d={nombre:n,unidad:v('iu'),costo:+v('ic')||0,stock:+v('is')||0,minimo:+v('im')||0};
  if(editId)Object.assign(ins(editId),d);else db.insumos.push({id:uid(),...d});$('modal').innerHTML='';toast('Guardado')},
delIns(id){const u=db.productos.filter(p=>isPl(p)&&p.receta.some(r=>r.id===id));
  if(u.length){toast('Está en la receta de: '+u.map(p=>p.nombre).join(', '));return 1}
  if(confirm('¿Borrar insumo?'))db.insumos=db.insumos.filter(i=>i.id!==id);else return 1},
addCompra(){const p=ins(v('p')),n=+v('q');if(!p||!n){toast('Completá insumo y cantidad');return 1}const co=+v('co')||p.costo;
  db.compras.push({id:uid(),fecha:v('d'),prov:v('pv'),pid:p.id,nombre:p.nombre,cant:n,costo:co});p.stock=rd(p.stock+n);p.costo=co;toast('Compra registrada')},
delCompra(id){const c=db.compras.find(x=>x.id===id),p=ing(c.pid);if(p)p.stock=rd(p.stock-c.cant);db.compras=db.compras.filter(x=>x.id!==id)},
addAbono(){const n=v('n').trim();if(!n)return 1;db.abonos.push({id:uid(),nombre:n,tipo:v('t'),monto:+v('m')||0,dia:+v('di')||1})},
togPago(id){const k=id+'|'+mes;if(db.pagos[k])delete db.pagos[k];else db.pagos[k]=today()},
delAbono(id){if(confirm('¿Borrar abono?'))db.abonos=db.abonos.filter(a=>a.id!==id);else return 1},
logout(){sb.auth.signOut().then(()=>location.reload());return 1},
setLocal(){db.cfg.local=v('loc').trim()||'Gastro';toast('Guardado')},
copy(){const t=$('exp');t.select();try{document.execCommand('copy');toast('Copiado')}catch(e){}return 1},
import(){try{const d=JSON.parse(v('imp'));if(!d.productos)throw 0;if(!confirm('Esto reemplaza los datos actuales.'))return 1;db=Object.assign(EMPTY(),d);migrar()}catch(e){toast('Respaldo inválido');return 1}},
reset(){if(confirm('¿Borrar TODOS los datos?'))db=EMPTY();else return 1}
};

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;q='';render();return}
  const f=A[b.dataset.act];if(!f)return;
  if(f(b.dataset.id)===1)return;
  save();render();
});
document.addEventListener('input',e=>{if(e.target.dataset.q===undefined)return;q=e.target.value;
  if($('grid'))$('grid').innerHTML=grid();if($('lst'))$('lst').innerHTML=tab==='insumos'?insTbl():stockTbl()});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.mes!==undefined){mes=e.target.value||mes;render()}
  else if(d.mp!==undefined)mp=e.target.value;
  else if(d.pl!==undefined){readM();tmp.plato=e.target.checked;if(tmp.plato&&!tmp.receta.length){const f=db.insumos[0];if(f)tmp.receta.push({id:f.id,cant:0})}modal()}});
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!uidU||pend||$('modal').innerHTML)return;
  const {data:h}=await sb.from('datos').select('updated_at');
  if(!h||!h.some(r=>+new Date(r.updated_at)>lastTs))return;
  const {data}=await sb.from('datos').select('k,v,updated_at');if(!data||pend)return;
  lastTs=Math.max(0,...data.map(r=>+new Date(r.updated_at)));db=join(data);
  const o=split(db);synced={};Object.keys(o).forEach(k=>synced[k]=JSON.stringify(o[k]));
  if(migrar())save();render();setSync('● Sincronizado')});
start();
</script>
</body>
</html>
